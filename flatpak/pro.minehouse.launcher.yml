# Flatpak build of the launcher, published to our own repository on GitHub Pages
# by .github/workflows/flatpak.yml after every release (see flatpak/README.md).
# It repackages the release .deb (Tauri's recommended way); publish.sh puts it
# next to this file as minehouse-launcher.deb before building.
id: pro.minehouse.launcher
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: minehouse-launcher
finish-args:
  - --share=ipc
  - --share=network
  # The launcher window (WebKitGTK) and Minecraft 26.x (LWJGL 3.4 / SDL3,
  # built with Wayland support) both run natively on Wayland.
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Game sound and the proximity voice chat microphone.
  - --socket=pulseaudio
  # The Microsoft refresh token lives in the Secret Service keyring.
  - --talk-name=org.freedesktop.secrets
  # Picking own mod .jar files in the file dialog.
  - --filesystem=xdg-download:ro
modules:
  - name: minehouse-launcher
    buildsystem: simple
    sources:
      - type: file
        path: minehouse-launcher.deb
        only-arches: [x86_64]
    build-commands:
      - ar -x minehouse-launcher.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/minehouse-launcher -t /app/bin
      - install -Dm644 usr/share/metainfo/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
      - install -Dm644 usr/share/applications/MineHouse.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} --set-key=StartupWMClass --set-value=minehouse-launcher
        /app/share/applications/${FLATPAK_ID}.desktop
      - |
        for size in 32x32 128x128 256x256@2; do
          src=usr/share/icons/hicolor/$size/apps/minehouse-launcher.png
          [ -f "$src" ] || continue
          dir=${size%@2}
          install -Dm644 "$src" /app/share/icons/hicolor/$dir/apps/${FLATPAK_ID}.png
        done
