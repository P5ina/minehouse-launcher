name: Flatpak
# After every successful Release: repackages its .deb as a Flatpak, publishes
# the signed Flatpak repository on GitHub Pages (installed launchers update
# with `flatpak update`) and attaches a .flatpak bundle to the release.
# Needs secret FLATPAK_GPG_PRIVATE_KEY and Settings → Pages → Source: GitHub Actions.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flatpak
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Download release .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release download "v$v" -p "MineHouse_${v}_amd64.deb" -O "$RUNNER_TEMP/minehouse.deb"
      - name: Install flatpak-builder
        run: |
          # Ubuntu 24.04 blocks unprivileged user namespaces, bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - name: Import signing key
        id: gpg
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::secret FLATPAK_GPG_PRIVATE_KEY is not set"; exit 1; fi
          echo "$KEY" | gpg --batch --import
          echo "id=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        run: |
          flatpak/publish.sh "$RUNNER_TEMP/minehouse.deb" "${{ steps.v.outputs.version }}" \
            "${{ steps.gpg.outputs.id }}" \
            "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}" \
            site
      - name: Attach bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.v.outputs.version }}
          gh release upload "v$v" "site/MineHouse_${v}_x86_64.flatpak" --clobber
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
