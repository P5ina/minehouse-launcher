name: Release
# Publishes installers and latest.json (running launchers update from it) as
# release v<version from Cargo.toml>. Run it from the Actions tab
# ("Run workflow") after bumping the version, or push a tag like v0.2.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, args: "" }
          - { name: macos-arm, os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { name: macos-intel, os: macos-latest, args: "--target x86_64-apple-darwin" }
          - { name: linux, os: ubuntu-22.04, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      # Подпись Developer ID и нотаризация Apple (секреты в README). Без секретов
      # сборка остаётся неподписанной, как раньше, и релиз не падает.
      - name: Apple signing setup
        if: startsWith(matrix.name, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::Нет APPLE_CERTIFICATE/APPLE_SIGNING_IDENTITY: macOS-сборка не будет подписана"
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "MINEHOUSE_MAC_SIGNED=1"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            {
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY_PATH=$key"
            } >> "$GITHUB_ENV"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::error::Сертификат есть, но нет данных для нотаризации (APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID или APPLE_API_KEY/APPLE_API_ISSUER/APPLE_API_KEY_P8)"
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Иначе на CI Tauri пропускает оформление окна dmg (фон и иконки).
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          # Azure app (public client ID, not a secret), see README.
          MINEHOUSE_MS_CLIENT_ID: ${{ vars.MINEHOUSE_MS_CLIENT_ID }}
        with:
          tagName: v__VERSION__
          releaseName: MineHouse Launcher v__VERSION__
          releaseBody: Скачайте установщик для своей системы ниже. Уже установленный лаунчер обновится сам.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      # Проверка: приложение подписано, нотаризовано и проштамповано, а архив
      # обновления (.app.tar.gz из latest.json) содержит ту же подписанную сборку.
      - name: Verify macOS signature
        if: startsWith(matrix.name, 'macos') && env.MINEHOUSE_MAC_SIGNED == '1'
        shell: bash
        run: |
          set -euo pipefail
          dir=$(echo target/*/release/bundle/macos)
          app="$dir/MineHouse.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$(echo target/*/release/bundle/dmg/*.dmg)" || echo "::warning::dmg без штампа (Gatekeeper проверит онлайн)"
          tmp=$(mktemp -d)
          tar -xzf "$dir/MineHouse.app.tar.gz" -C "$tmp"
          codesign --verify --deep --strict --verbose=2 "$tmp/MineHouse.app"
          spctl --assess --type execute --verbose=4 "$tmp/MineHouse.app"
          test -f "$dir/MineHouse.app.tar.gz.sig"
