name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Core tests + real install
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      # tauri::generate_context! embeds ui/dist, so build the interface first.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Downloads Java, Minecraft, Fabric and the modpack from the live site and
      # checks every file and `java -version`. Does not start the game.
      - name: Install smoke test
        env:
          MINEHOUSE_HOME: ${{ runner.temp }}/minehouse
        run: cargo run --release -p minehouse-core --bin mh-cli -- install > /dev/null

  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, args: "--no-bundle" }
          # dmg тоже собираем: так видно, что фон и раскладка окна установщика в порядке.
          - { name: macos-arm, os: macos-latest, args: "--target aarch64-apple-darwin --bundles dmg" }
          - { name: linux, os: ubuntu-22.04, args: "--no-bundle" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      # No signing key on PRs: build the app without updater artifacts.
      - run: pnpm tauri build ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json
      # Скриншот окна установщика, как его увидит игрок (артефакт dmg-window).
      - name: Screenshot dmg window
        if: matrix.name == 'macos-arm'
        continue-on-error: true
        run: |
          dmg=$(echo target/*/release/bundle/dmg/*.dmg)
          hdiutil attach "$dmg" -mountpoint /Volumes/MineHouse
          open /Volumes/MineHouse
          sleep 5
          screencapture -x dmg-window.png
      - if: matrix.name == 'macos-arm'
        uses: actions/upload-artifact@v4
        with:
          name: dmg-window
          path: dmg-window.png
          if-no-files-found: ignore
      # Готовый исполняемый файл для проверки PR: вкладка Summary → Artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: minehouse-launcher-${{ matrix.name }}
          path: |
            target/release/minehouse-launcher
            target/release/minehouse-launcher.exe
            target/*/release/minehouse-launcher
            target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error
