name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    name: Core tests + real install
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Downloads Java, Minecraft, Fabric and the modpack from the live site and
      # checks every file and `java -version`. Does not start the game.
      - name: Install smoke test
        env:
          MINEHOUSE_HOME: ${{ runner.temp }}/minehouse
        run: cargo run --release -p minehouse-core --bin mh-cli -- install > /dev/null

  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, args: "" }
          - { name: macos-arm, os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { name: linux, os: ubuntu-22.04, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      # No signing key on PRs: build the app without updater artifacts.
      - run: pnpm tauri build --no-bundle ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json
