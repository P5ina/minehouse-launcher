[package]
name = "minehouse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Install, update and launch logic of the MineHouse launcher"

[dependencies]
anyhow = "1"
directories = "6"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "mh-cli"
path = "src/bin/mh-cli.rs"
